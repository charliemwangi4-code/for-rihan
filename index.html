<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rihan 💗</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="hearts"></div>


<!-- PAGE 1 -->

<section class="hero">

    <h1>
        For My Pretty Girl<br>
        <span class="name">Rihan 🥹💕</span>
    </h1>

    <p>
        I made something special just for you...
    </p>

    <button id="startButton">
        🌸 Enter 🌸
    </button>

</section>


<!-- PAGE 2 -->

<section id="intro" class="intro hidden">

    <h1 id="typing"></h1>

    <p id="typing2"></p>

    <button id="continueBtn">
        Continue 🌸
    </button>

</section>


<!-- PAGE 3 -->

<section id="chapter1" class="chapter hidden">

    <h1>💗 Our Little Story 💗</h1>

    <p class="chapterText">
        Every beautiful story has a beginning...
    </p>

    <img
        src="rihan.jpg"
        alt="Rihan 💗"
        class="rihanPhoto"
    >

    <p class="photoMessage">
        And somehow, mine became so much more beautiful
        when you became part of it 🥹💕
    </p>

    <button id="nextButton">
        Next 🌷
    </button>

</section>


<script src="script.js"></script>

</body>
</html>
